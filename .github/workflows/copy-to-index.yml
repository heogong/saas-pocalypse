name: Copy to index.html

on:
  push:
    branches:
      - main
    paths:
      - 'saas-apocalypse-framework.html'
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy saas-apocalypse-framework.html to index.html
        run: cp saas-apocalypse-framework.html index.html

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: sync index.html from saas-apocalypse-framework.html"
          git push
